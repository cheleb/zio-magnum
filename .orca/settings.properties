# orca settings — edit freely, commit with the project.
# format/lint/test: one shell command per key; `off` disables the gate. Delete the stack lines (or the whole file) to re-run auto-discovery.
# planningAgent/codingAgent/reviewAgent (harness[:model]): override the global settings file; a flow's own code overrides both.
# project/plugins.sbt; sbt-scalafmt 2.6.2 is declared (line 3) and .scalafmt.conf (maxColumn/scala3 dialect) configures it; scalafmtAll formats main and test sources of all aggregated projects. Requires sbt, selected by project/build.properties (sbt.version=1.13.1).
format = sbt scalafmtAll
# build.sbt; Compiles main and test sources of the aggregated projects (scalacOptions include -Werror, -Wunused:all) and executes no tests. sbt is selected by project/build.properties.
lint = sbt Test/compile
# .github/workflows/ci.yml; CI runs `sbt "test"` (line 35). Test deps include testcontainers-scala-postgresql, so Docker is required at runtime.
test = sbt test
